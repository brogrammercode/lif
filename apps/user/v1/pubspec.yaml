name: user
description: 1more user app.
publish_to: "none"
version: 0.1.7+7

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  geolocator: ^14.0.3
  iconsax: ^0.0.8
  dio: ^5.11.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  firebase_core: ^4.15.0
  maplibre_gl: ^0.27.1
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  # flutter_html 3.0.0 calls matches(), removed from html 0.15.7.
  # Keep exact until the renderer supports the newer selector API.
  html: 0.15.6
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  url_launcher: ^6.3.3
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/login-tennis-bg.png
    - .env
    - shorebird.yaml
